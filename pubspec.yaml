name: foodpanda_admin
description: FoodPanda Admin Portal for managing shops, menus, categories, vouchers, riders, and banners.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  firebase_storage: ^14.0.1
  google_maps_flutter: ^2.19.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.4
  dotted_border: ^2.1.0
  calendar_date_picker2: ^4.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
